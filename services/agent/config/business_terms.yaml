# 业务术语口径（开发人员维护）
#
# 说明：
# - confirmed 中的术语表示已与用户确认、可以据此生成 SQL 与结论的口径。
# - unconfirmed 中的术语表示口径尚未确认；Agent 命中后会要求澄清，不得作为事实输出。
# - 本文件只放术语与口径说明，不放任何凭据、连接信息或真实数据。
# - 修改后需同步检查 app/agent/business_terms.py 的内置默认值，二者应保持一致。

confirmed:
  消费金额:
    definition: 按授权消费视图的金额字段直接求和；不等于扣除退款后的净收入；货币单位未确认，不得擅自标注元/人民币/CNY 等
  交易记录数:
    definition: 授权消费视图的数据行数；不等于唯一订单数
  会员注册记录数:
    definition: 授权会员视图的数据行数；不等于唯一会员数
  门店维度统计:
    definition: 按授权消费视图中的门店字段分组统计

unconfirmed:
  净收入:
    definition: 退款、优惠、补贴等口径尚未确认，禁止作为事实输出
  唯一会员数:
    definition: 会员与消费的关联键尚未确认，无法从消费视图推导唯一会员数
  唯一订单数:
    definition: 授权视图中没有稳定的订单唯一标识，禁止把数据行数当作唯一订单数
  会员消费关联:
    definition: 会员与消费的关联键尚未确认，禁止对会员与消费对象做 JOIN
