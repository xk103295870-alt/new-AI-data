[project]
name = "ai-data-agent"
version = "0.1.0"
description = "AI 商业数据分析 Agent 后端（FastAPI）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "aiomysql>=0.3.2,<0.4",
    "sqlglot==27.20.0",
    # Task D：LLM HTTP 调用为运行时依赖；PyYAML 读取业务术语文件。
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    # 仅独立离线导入工具及其测试使用，不属于 API 运行时依赖（运行时依赖见 [project].dependencies）。
    "openpyxl>=3.1.5,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
